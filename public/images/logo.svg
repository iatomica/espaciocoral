<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 90" fill="none">
  <!-- Tooth + Coral Geometry Icon -->
  <g transform="translate(10, 5)">
    <!-- Coral colored organic gradient droplet / backing -->
    <defs>
      <linearGradient id="coralGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#F26A51"/>
        <stop offset="100%" stop-color="#E76F51"/>
      </linearGradient>
      <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#0E8A85"/>
        <stop offset="100%" stop-color="#075E5B"/>
      </linearGradient>
    </defs>
    
    <!-- Outer Shield / Coral Drop Accent -->
    <circle cx="40" cy="40" r="38" fill="#F0FDFA" stroke="#CCFBF1" stroke-width="2"/>
    <circle cx="58" cy="22" r="10" fill="url(#coralGrad)" opacity="0.85"/>
    
    <!-- Stylized Modern Tooth in Deep Teal -->
    <path d="M40 18 C28 18 22 24 22 36 C22 47 26 53 29 65 C31 72 35 73 38 67 C40 63 40 54 42 54 C44 54 44 63 46 67 C49 73 53 72 55 65 C58 53 62 47 62 36 C62 24 56 18 44 18 C42.5 18 41.5 19 40 19 C38.5 19 37.5 18 40 18 Z" 
          fill="url(#tealGrad)" />
    
    <!-- Coral Arch Sparkle / Shine -->
    <path d="M30 28 C34 23 44 23 50 27" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.9"/>
    <circle cx="52" cy="24" r="2.5" fill="#FFFFFF"/>
  </g>

  <!-- Typography -->
  <text x="105" y="44" font-family="'Outfit', sans-serif" font-size="28" font-weight="800" fill="#0F172A" letter-spacing="-0.5">ESPACIO <tspan fill="#F26A51">CORAL</tspan></text>
  <text x="106" y="66" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#0D9488" letter-spacing="4">ODONTOLOGÍA</text>
</svg>
