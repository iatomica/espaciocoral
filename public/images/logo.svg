<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 85" fill="none">
  <defs>
    <!-- Organic Leaf Gradient -->
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8BB845"/>
      <stop offset="100%" stop-color="#678E29"/>
    </linearGradient>
    <!-- Lavender Smile Gradient -->
    <linearGradient id="smileGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A579C6"/>
      <stop offset="100%" stop-color="#8457A3"/>
    </linearGradient>
  </defs>

  <!-- Logo Mark Group -->
  <g transform="translate(6, 4)">
    <!-- Smile Arc in Lavender -->
    <path d="M 6 36 C 4 33 6 29 10 30 C 13 31 13 35 11 38 C 19 55 35 68 59 69 C 75 70 91 63 103 49 C 105 47 108 48 107 51 C 93 68 74 77 56 75 C 30 73 12 58 6 36 Z" 
          fill="url(#smileGrad)" />
    <circle cx="10" cy="33" r="3.5" fill="#8457A3" />

    <!-- Organic Eco Leaf in Fresh Green -->
    <path d="M 66 52 C 67 36 78 18 108 8 C 111 7 114 10 112 13 C 105 32 108 48 93 62 C 81 74 65 67 66 52 Z" 
          fill="none" stroke="url(#leafGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 108 10 C 95 24 87 38 85 53" 
          fill="none" stroke="url(#leafGrad)" stroke-width="3" stroke-linecap="round" />
    <path d="M 93 30 C 99 32 102 36 103 40" 
          fill="none" stroke="url(#leafGrad)" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Brand Typography -->
  <g transform="translate(132, 48)">
    <text x="0" y="0" font-family="'Outfit', system-ui, -apple-system, sans-serif" font-size="24" font-weight="800" fill="#8457A3" letter-spacing="1">ODONTOLOGÍA <tspan fill="#6EA02E" font-weight="900">ECO</tspan></text>
    <text x="1" y="19" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#586E4D" letter-spacing="3.2">SAN TELMO · BUENOS AIRES</text>
  </g>
</svg>
